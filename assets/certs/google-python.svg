<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#112240"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="python-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387eb8"/>
      <stop offset="100%" stop-color="#306998"/>
    </linearGradient>
    <linearGradient id="python-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe873"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
    <pattern id="grid-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#387eb8" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid-dots)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="797" height="497" rx="14.5" fill="none" stroke="#387eb8" stroke-width="1.5" opacity="0.5"/>

  <!-- Top Accent Bar (Google 4 colors) -->
  <rect x="0" y="0" width="200" height="6" fill="#4285F4"/>
  <rect x="200" y="0" width="200" height="6" fill="#EA4335"/>
  <rect x="400" y="0" width="200" height="6" fill="#FBBC05"/>
  <rect x="600" y="0" width="200" height="6" fill="#34A853"/>

  <!-- Google & Python Brand Header -->
  <g transform="translate(60, 55)">
    <!-- Google 'G' icon -->
    <path d="M22.5 12.2c0-.9-.1-1.7-.2-2.5H11.5v4.8h6.2c-.3 1.4-1.1 2.7-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.7z" fill="#4285F4"/>
    <path d="M11.5 23.4c3.2 0 5.9-1.1 7.9-2.9l-3.7-2.9c-1.1.7-2.5 1.2-4.2 1.2-3.2 0-5.9-2.2-6.9-5.1H.8v3c2 4 6.1 6.7 10.7 6.7z" fill="#34A853"/>
    <path d="M4.6 13.7c-.3-.7-.4-1.5-.4-2.2 0-.8.1-1.6.4-2.2V6.3H.8C.3 7.3 0 8.3 0 9.5c0 1.2.3 2.2.8 3.2l3.8-2z" fill="#FBBC05"/>
    <path d="M11.5 4.8c1.8 0 3.3.6 4.5 1.8l3.4-3.4C17.4 1.2 14.7 0 11.5 0 6.9 0 2.8 2.7.8 6.7l3.8 3c1-2.9 3.7-5.1 6.9-5.1z" fill="#EA4335"/>
    
    <text x="35" y="16" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Google Career Certificates</text>
    <text x="35" y="36" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#ffd43b" letter-spacing="2">PYTHON AUTOMATION &amp; SCRIPTING</text>
  </g>

  <!-- Verified Badge Ribbon -->
  <g transform="translate(630, 48)">
    <rect width="115" height="30" rx="15" fill="#306998" fill-opacity="0.3" stroke="#ffd43b" stroke-width="1"/>
    <circle cx="18" cy="15" r="5" fill="#ffd43b"/>
    <text x="32" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffe873" letter-spacing="1">COMPLETED</text>
  </g>

  <!-- Certificate Title Area -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#94a3b8" letter-spacing="3">COURSERA / GOOGLE IT AUTOMATION</text>
    <text x="0" y="42" font-family="'Inter', sans-serif" font-weight="800" font-size="32" fill="#ffffff">Crash Course on Python</text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#cbd5e1" max-width="600">
      Comprehensive foundation in Python programming, data structures (lists, tuples, dicts),
    </text>
    <text x="0" y="104" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#cbd5e1">
      object-oriented programming (OOP), file operations, and practical script automation.
    </text>
  </g>

  <!-- Tags / Skills -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="75" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="37" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">Python</text>

    <rect x="85" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="150" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffd43b" text-anchor="middle">Data Structures</text>

    <rect x="225" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="300" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#60a5fa" text-anchor="middle">Object-Oriented (OOP)</text>

    <rect x="385" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="437" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#34d399" text-anchor="middle">Automation</text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="410" x2="740" y2="410" stroke="#334155" stroke-width="1"/>

  <!-- Footer Info -->
  <g transform="translate(60, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">ISSUER</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Google / Coursera</text>
  </g>

  <g transform="translate(320, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">CATEGORY</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#38bdf8">Programming</text>
  </g>

  <g transform="translate(560, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">LANGUAGE</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#ffd43b">Python 3</text>
  </g>
</svg>
