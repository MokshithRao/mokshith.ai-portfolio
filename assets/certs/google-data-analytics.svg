<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1118"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.8"/>
      <stop offset="33%" stop-color="#EA4335" stop-opacity="0.6"/>
      <stop offset="66%" stop-color="#FBBC05" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34A853" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#8ab4f8"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad)"/>
  <rect x="8" y="8" width="784" height="484" rx="12" fill="none" stroke="url(#border-grad)" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="460" rx="8" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Watermark Grid Pattern -->
  <circle cx="700" cy="100" r="140" fill="#4285F4" opacity="0.04" filter="blur(40px)"/>
  <circle cx="100" cy="400" r="140" fill="#34A853" opacity="0.04" filter="blur(40px)"/>

  <!-- Google Header Icon & Logo -->
  <g transform="translate(60, 60)">
    <circle cx="28" cy="28" r="28" fill="rgba(66, 133, 244, 0.12)" stroke="rgba(66, 133, 244, 0.3)" stroke-width="1.5"/>
    <text x="28" y="36" font-family="'Geist', 'Inter', sans-serif" font-weight="700" font-size="24" fill="#4285F4" text-anchor="middle">G</text>
    <text x="70" y="26" font-family="'Geist', 'Inter', sans-serif" font-weight="700" font-size="20" fill="#ffffff" letter-spacing="0.05em">Google</text>
    <text x="70" y="44" font-family="'Inter', sans-serif" font-size="12" fill="#8ab4f8" letter-spacing="0.1em">CAREER CERTIFICATE</text>
  </g>

  <!-- Verified Badge Ribbon -->
  <g transform="translate(620, 56)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(52, 168, 83, 0.15)" stroke="rgba(52, 168, 83, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#34A853"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#81c995" letter-spacing="0.05em">VERIFIED</text>
  </g>

  <!-- Certificate Title -->
  <text x="60" y="190" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8c909f" letter-spacing="0.15em">PROFESSIONAL CERTIFICATION</text>
  <text x="60" y="235" font-family="'Geist', 'Inter', sans-serif" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="-0.01em">Google Data Analytics</text>
  <text x="60" y="275" font-family="'Inter', sans-serif" font-size="15" fill="#c2c6d6">Issued by Google via Coursera • Completed in 2024</text>

  <!-- Skills Chips -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="rgba(66, 133, 244, 0.12)" stroke="rgba(66, 133, 244, 0.25)" stroke-width="1"/>
    <text x="55" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#adc6ff" text-anchor="middle">SQL &amp; R</text>

    <rect x="120" y="0" width="130" height="28" rx="6" fill="rgba(66, 133, 244, 0.12)" stroke="rgba(66, 133, 244, 0.25)" stroke-width="1"/>
    <text x="185" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#adc6ff" text-anchor="middle">Data Analysis</text>

    <rect x="260" y="0" width="100" height="28" rx="6" fill="rgba(66, 133, 244, 0.12)" stroke="rgba(66, 133, 244, 0.25)" stroke-width="1"/>
    <text x="310" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#adc6ff" text-anchor="middle">Tableau</text>

    <rect x="370" y="0" width="140" height="28" rx="6" fill="rgba(66, 133, 244, 0.12)" stroke="rgba(66, 133, 244, 0.25)" stroke-width="1"/>
    <text x="440" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#adc6ff" text-anchor="middle">Data Visualization</text>
  </g>

  <!-- Certificate Bottom Meta -->
  <line x1="60" y1="410" x2="740" y2="410" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="60" y="445" font-family="'Geist Mono', monospace" font-size="11" fill="#8c909f">CREDENTIAL: GOOGLE-DATA-ANALYTICS-2024</text>
  <text x="740" y="445" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#4285F4" text-anchor="end">DATA SCIENCE</text>
</svg>
