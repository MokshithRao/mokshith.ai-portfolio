<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aws-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="50%" stop-color="#1b202c"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="aws-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#232F3E" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#aws-bg)"/>
  <rect x="8" y="8" width="784" height="484" rx="12" fill="none" stroke="url(#aws-border)" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="460" rx="8" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="700" cy="100" r="140" fill="#FF9900" opacity="0.04" filter="blur(40px)"/>

  <!-- AWS Header -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="rgba(255, 153, 0, 0.12)" stroke="rgba(255, 153, 0, 0.3)" stroke-width="1.5"/>
    <text x="28" y="36" font-family="'Geist', sans-serif" font-weight="800" font-size="20" fill="#FF9900" text-anchor="middle">AWS</text>
    <text x="72" y="26" font-family="'Geist', 'Inter', sans-serif" font-weight="700" font-size="20" fill="#ffffff">AWS Academy</text>
    <text x="72" y="44" font-family="'Inter', sans-serif" font-size="12" fill="#FF9900" letter-spacing="0.1em">GRADUATE ACCREDITATION</text>
  </g>

  <!-- Verified Badge Ribbon -->
  <g transform="translate(620, 56)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(255, 153, 0, 0.15)" stroke="rgba(255, 153, 0, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#FF9900"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffb84d" letter-spacing="0.05em">VERIFIED</text>
  </g>

  <text x="60" y="190" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8c909f" letter-spacing="0.15em">ACCREDITED CERTIFICATION</text>
  <text x="60" y="235" font-family="'Geist', 'Inter', sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-0.01em">AWS Academy Machine Learning Foundations</text>
  <text x="60" y="275" font-family="'Inter', sans-serif" font-size="15" fill="#c2c6d6">Issued by Amazon Web Services (AWS) Academy • 2024</text>

  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="150" height="28" rx="6" fill="rgba(255, 153, 0, 0.12)" stroke="rgba(255, 153, 0, 0.25)" stroke-width="1"/>
    <text x="75" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffc066" text-anchor="middle">AWS SageMaker</text>

    <rect x="160" y="0" width="140" height="28" rx="6" fill="rgba(255, 153, 0, 0.12)" stroke="rgba(255, 153, 0, 0.25)" stroke-width="1"/>
    <text x="230" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffc066" text-anchor="middle">Machine Learning</text>

    <rect x="310" y="0" width="130" height="28" rx="6" fill="rgba(255, 153, 0, 0.12)" stroke="rgba(255, 153, 0, 0.25)" stroke-width="1"/>
    <text x="375" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffc066" text-anchor="middle">Deep Learning</text>
  </g>

  <line x1="60" y1="410" x2="740" y2="410" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="60" y="445" font-family="'Geist Mono', monospace" font-size="11" fill="#8c909f">CREDENTIAL: AWS-ACADEMY-ML-FOUNDATIONS</text>
  <text x="740" y="445" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#FF9900" text-anchor="end">AI / ML</text>
</svg>
