<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1610"/>
      <stop offset="50%" stop-color="#141f17"/>
      <stop offset="100%" stop-color="#0a0f0b"/>
    </linearGradient>
    <linearGradient id="nv-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76B900" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a330a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#nv-bg)"/>
  <rect x="8" y="8" width="784" height="484" rx="12" fill="none" stroke="url(#nv-border)" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="460" rx="8" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="700" cy="100" r="140" fill="#76B900" opacity="0.05" filter="blur(40px)"/>

  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="rgba(118, 185, 0, 0.12)" stroke="rgba(118, 185, 0, 0.3)" stroke-width="1.5"/>
    <text x="28" y="36" font-family="'Geist', sans-serif" font-weight="800" font-size="20" fill="#76B900" text-anchor="middle">NV</text>
    <text x="72" y="26" font-family="'Geist', 'Inter', sans-serif" font-weight="700" font-size="20" fill="#ffffff">NVIDIA DLI</text>
    <text x="72" y="44" font-family="'Inter', sans-serif" font-size="12" fill="#76B900" letter-spacing="0.1em">DEEP LEARNING INSTITUTE</text>
  </g>

  <g transform="translate(620, 56)">
    <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(118, 185, 0, 0.15)" stroke="rgba(118, 185, 0, 0.4)" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#76B900"/>
    <text x="32" y="21" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#9de62e" letter-spacing="0.05em">VERIFIED</text>
  </g>

  <text x="60" y="190" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8c909f" letter-spacing="0.15em">TECHNICAL CERTIFICATE OF COMPETENCY</text>
  <text x="60" y="235" font-family="'Geist', 'Inter', sans-serif" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="-0.01em">Fundamentals of Deep Learning</text>
  <text x="60" y="275" font-family="'Inter', sans-serif" font-size="15" fill="#c2c6d6">Issued by NVIDIA Deep Learning Institute (DLI) • 2024</text>

  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="110" height="28" rx="6" fill="rgba(118, 185, 0, 0.12)" stroke="rgba(118, 185, 0, 0.25)" stroke-width="1"/>
    <text x="55" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a6f338" text-anchor="middle">PyTorch</text>

    <rect x="120" y="0" width="140" height="28" rx="6" fill="rgba(118, 185, 0, 0.12)" stroke="rgba(118, 185, 0, 0.25)" stroke-width="1"/>
    <text x="190" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a6f338" text-anchor="middle">Neural Networks</text>

    <rect x="270" y="0" width="160" height="28" rx="6" fill="rgba(118, 185, 0, 0.12)" stroke="rgba(118, 185, 0, 0.25)" stroke-width="1"/>
    <text x="350" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a6f338" text-anchor="middle">Computer Vision</text>
  </g>

  <line x1="60" y1="410" x2="740" y2="410" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="60" y="445" font-family="'Geist Mono', monospace" font-size="11" fill="#8c909f">CREDENTIAL: NVIDIA-DLI-DEEP-LEARNING</text>
  <text x="740" y="445" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#76B900" text-anchor="end">AI / ML</text>
