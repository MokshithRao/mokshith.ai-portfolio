<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="aws-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ffb84d"/>
    </linearGradient>
    <linearGradient id="aws-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#232f3e"/>
      <stop offset="100%" stop-color="#3b4d61"/>
    </linearGradient>
    <pattern id="cloud-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.2" fill="#ff9900" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad)"/>
  <rect width="800" height="500" rx="16" fill="url(#cloud-grid)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="797" height="497" rx="14.5" fill="none" stroke="#ff9900" stroke-width="1.5" opacity="0.5"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#aws-gold)"/>

  <!-- AWS Academy Header -->
  <g transform="translate(60, 55)">
    <!-- AWS Box Logo -->
    <rect width="48" height="34" rx="6" fill="#232f3e" stroke="#ff9900" stroke-width="1.5"/>
    <text x="24" y="23" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#ff9900" text-anchor="middle">AWS</text>
    
    <text x="62" y="20" font-family="'Inter', sans-serif" font-weight="800" font-size="20" fill="#ffffff">AWS Academy Graduate</text>
    <text x="62" y="38" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#ff9900" letter-spacing="2">CLOUD COMPUTING FOUNDATIONS</text>
  </g>

  <!-- Verified Badge Ribbon -->
  <g transform="translate(630, 48)">
    <rect width="115" height="30" rx="15" fill="#ff9900" fill-opacity="0.15" stroke="#ff9900" stroke-width="1"/>
    <circle cx="18" cy="15" r="5" fill="#ff9900"/>
    <text x="32" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ffb84d" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Certificate Title Area -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#94a3b8" letter-spacing="3">ACADEMY ACCREDITATION</text>
    <text x="0" y="42" font-family="'Inter', sans-serif" font-weight="800" font-size="32" fill="#ffffff">AWS Academy Cloud</text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="800" font-size="32" fill="#ff9900">Foundations</text>
    <text x="0" y="120" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#cbd5e1" max-width="600">
      Comprehensive understanding of AWS cloud concepts, core AWS services (EC2, S3, RDS, IAM, VPC),
    </text>
    <text x="0" y="144" font-family="'Inter', sans-serif" font-weight="400" font-size="15" fill="#cbd5e1">
      security principles, pricing models, architectural best practices, and cloud economics.
    </text>
  </g>

  <!-- Tags / Skills -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ff9900" text-anchor="middle">Cloud Computing</text>

    <rect x="140" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="202" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">AWS Architecture</text>

    <rect x="275" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="327" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#a78bfa" text-anchor="middle">IAM &amp; Security</text>

    <rect x="390" y="0" width="120" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="450" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#34d399" text-anchor="middle">EC2, S3, RDS</text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="410" x2="740" y2="410" stroke="#334155" stroke-width="1"/>

  <!-- Footer Info -->
  <g transform="translate(60, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">ISSUER</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Amazon Web Services (AWS)</text>
  </g>

  <g transform="translate(320, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">CATEGORY</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#ff9900">Cloud</text>
  </g>

  <g transform="translate(560, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">PROGRAM</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">AWS Academy</text>
  </g>
</svg>
