<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#140f2d"/>
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="matrix" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ec4899" opacity="0.12"/>
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" stroke="#8b5cf6" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg-grad)"/>
  <rect width="800" height="500" rx="16" fill="url(#matrix)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="797" height="497" rx="14.5" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" opacity="0.6"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="800" height="6" fill="url(#primary-glow)"/>

  <!-- Corner Tech Accents -->
  <path d="M 30 50 L 50 30" stroke="#ec4899" stroke-width="2" opacity="0.4"/>
  <path d="M 770 50 L 750 30" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>

  <!-- Organization Logo / Header -->
  <g transform="translate(60, 55)">
    <!-- Hexagon icon -->
    <polygon points="20,0 40,11 40,34 20,45 0,34 0,11" fill="url(#badge-glow)" opacity="0.9"/>
    <text x="20" y="27" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">RT</text>
    
    <text x="55" y="22" font-family="'Inter', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="1">READY TENSOR</text>
    <text x="55" y="40" font-family="'Inter', sans-serif" font-weight="500" font-size="12" fill="#ec4899" letter-spacing="2">AI &amp; LLM ENGINEERING COMPETENCY</text>
  </g>

  <!-- Verified Badge Ribbon -->
  <g transform="translate(630, 48)">
    <rect width="115" height="30" rx="15" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="1"/>
    <circle cx="18" cy="15" r="5" fill="#ec4899"/>
    <text x="32" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#f472b6" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Certificate Title Area -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="13" fill="#94a3b8" letter-spacing="3">CERTIFICATE OF COMPLETION</text>
    <text x="0" y="42" font-family="'Inter', sans-serif" font-weight="800" font-size="30" fill="#ffffff">Agentic AI &amp; LLM</text>
    <text x="0" y="80" font-family="'Inter', sans-serif" font-weight="800" font-size="30" fill="url(#primary-glow)">Engineering Masterclass</text>
    <text x="0" y="120" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#cbd5e1" max-width="600">
      Demonstrated proficiency in building autonomous multi-agent systems, tool calling,
    </text>
    <text x="0" y="142" font-family="'Inter', sans-serif" font-weight="400" font-size="14" fill="#cbd5e1">
      RAG architectures, LLM evaluation, and prompt engineering frameworks.
    </text>
  </g>

  <!-- Tags / Skills -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#ec4899" text-anchor="middle">Agentic Workflows</text>

    <rect x="140" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="202" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#a78bfa" text-anchor="middle">Multi-Agent Systems</text>

    <rect x="275" y="0" width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="320" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#60a5fa" text-anchor="middle">RAG &amp; Vector</text>

    <rect x="375" y="0" width="95" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="422" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle">Tool Calling</text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="410" x2="740" y2="410" stroke="#334155" stroke-width="1"/>

  <!-- Footer Info -->
  <g transform="translate(60, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">ISSUER</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#e2e8f0">Ready Tensor</text>
  </g>

  <g transform="translate(320, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">CATEGORY</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#ec4899">AI / ML</text>
  </g>

  <g transform="translate(560, 445)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#64748b">SPECIALIZATION</text>
    <text x="0" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#a78bfa">LLM Engineering</text>
  </g>
</svg>
